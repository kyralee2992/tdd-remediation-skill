name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# OIDC for npm Trusted Publishing (preferred). Token publish still works
# when secrets.NPM_TOKEN is a valid granular automation token.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run security tests
        run: npm run test:security

      - name: Verify package metadata
        run: |
          node -e "const p=require('./package.json'); if(!p.name.startsWith('@')) process.exit(0); console.log('Scoped package:', p.name, p.version)"
          npm pkg get name version repository.url

      # Prefer provenance when publishing (works with Trusted Publishing OIDC
      # and with granular tokens that allow provenance).
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
